name: Build AumoDekstop (.NET 10 WinUI 3 Single-File)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish (${{ matrix.configuration }} | win-x64)
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]

    env:
      Project_Path: AumoDekstop.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Build application
        run: dotnet build $env:Project_Path -c $env:Configuration -r win-x64 -p:Platform=x64 --no-restore
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Publish single-file executable
        run: dotnet publish $env:Project_Path -c $env:Configuration -r win-x64 -p:Platform=x64 --no-build -o ./publish
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AumoDekstop-win-x64-SingleFile
          path: ./publish/AumoDekstop.exe
          retention-days: 7
