name: Build AumoDekstop (.NET 10 WinUI 3 Single-File)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish (${{ matrix.configuration }} | win-x64)
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]

    env:
      Project_Path: AumoDekstop.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore $env:Project_Path -r win-x64 -p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}
          
      - name: Build application
        run: dotnet build $env:Project_Path -c $env:Configuration -r win-x64 -p:Platform=x64 --no-restore
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Publish single-file executable
        run: dotnet publish $env:Project_Path -c $env:Configuration -r win-x64 -p:Platform=x64 --no-build -o ./publish
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Sign Executable, Build Installer & Sign Installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Siapkan file .pfx sementara
          $pfxPath = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_BASE64))

          # 2. Cari signtool.exe
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | 
                      Where-Object { $_.FullName -like "*\x64\*" } | 
                      Select-Object -First 1 -ExpandProperty FullName

          # 3. Tandatangani file utama AumoDekstop.exe
          & $signtool sign /f $pfxPath /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "./publish/AumoDekstop.exe"

          # 4. Compile Inno Setup untuk membuat Setup.exe (sudah termasuk codesign.cer)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup.iss"

          # 5. Cari & tandatangani file Setup.exe hasil Inno Setup secara dinamis
          $installerFile = Get-ChildItem -Path "./OutputInstaller" -Filter "*.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfxPath /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$installerFile"

          # 6. Bersihkan file .pfx sementara
          Remove-Item $pfxPath -Force

      - name: Upload Installer Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AumoDekstop-Installer-win-x64
          path: ./OutputInstaller/*.exe
          retention-days: 7

      - name: Upload Raw Executable (Fallback for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AumoDekstop-win-x64-Unsigned
          path: ./publish/AumoDekstop.exe
          retention-days: 1
